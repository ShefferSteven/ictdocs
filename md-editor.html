<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local Markdown Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f5f5f5;
    color: #24292f;
    display: flex;
    flex-direction: column;
  }
  #bar {
    background: #fff; border-bottom: 1px solid #d0d7de;
    padding: 10px 16px; display: flex; gap: 10px; align-items: center;
    flex-wrap: wrap; font-size: 14px;
  }
  #bar strong { margin-right: 4px; }
  #bar input[type=text] {
    font-size: 14px; padding: 4px 8px; border: 1px solid #d0d7de; border-radius: 4px;
    width: 180px;
  }
  button, #bar input[type=file]::file-selector-button {
    font-size: 13px; padding: 5px 10px; border: 1px solid #d0d7de; border-radius: 4px;
    background: #f6f8fa; cursor: pointer;
  }
  button:hover { background: #eee; }
  #status { color: #57606a; margin-left: auto; }
  #toolbar {
    background: #fafbfc; border-bottom: 1px solid #d0d7de;
    padding: 6px 16px; display: flex; gap: 6px; flex-wrap: wrap;
  }
  #toolbar button { font-family: inherit; }
  #panes {
    flex: 1; display: flex; min-height: 0;
  }
  #editor, #previewWrap {
    flex: 1 1 50%; min-width: 0; overflow-y: auto;
  }
  #editor {
    border: none; outline: none; resize: none;
    padding: 20px; font-family: ui-monospace, Consolas, monospace; font-size: 14px;
    line-height: 1.6; background: #fff; border-right: 1px solid #d0d7de;
  }
  #previewWrap { padding: 20px 32px; background: #fff; }
  #doc h1, #doc h2, #doc h3 { border-bottom: 1px solid #eee; padding-bottom: .3em; }
  #doc code { background: #f6f8fa; padding: .15em .35em; border-radius: 4px; font-size: 85%; }
  #doc pre { background: #f6f8fa; padding: 12px 16px; border-radius: 6px; overflow-x: auto; }
  #doc pre code { background: none; padding: 0; }
  #doc table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  #doc th, #doc td { border: 1px solid #d0d7de; padding: 6px 12px; }
  #doc th { background: #f6f8fa; }
  #doc blockquote { border-left: 4px solid #d0d7de; margin: 0; padding-left: 1em; color: #57606a; }
  .katex-display { overflow-x: auto; overflow-y: hidden; }
  @media (max-width: 800px) {
    #panes { flex-direction: column; }
    #editor { border-right: none; border-bottom: 1px solid #d0d7de; }
  }
</style>
</head>
<body>
  <div id="bar">
    <strong>Markdown Editor</strong>
    <button id="openBtn">Open…</button>
    <input type="file" id="picker" accept=".md,.markdown,text/markdown" hidden>
    <input type="text" id="filename" value="untitled.md">
    <button id="saveBtn">Save (download)</button>
    <button id="copyBtn">Copy Markdown</button>
    <span id="status"></span>
  </div>
  <div id="toolbar">
    <button data-wrap="**|**" title="Bold">B</button>
    <button data-wrap="_|_" title="Italic">I</button>
    <button data-line="# " title="Heading">H1</button>
    <button data-line="## " title="Subheading">H2</button>
    <button data-wrap="`|`" title="Inline code">Code</button>
    <button data-block="```matlab\n|\n```" title="Code block">Block</button>
    <button data-line="- " title="Bullet list">List</button>
    <button data-wrap="[|](url)" title="Link">Link</button>
    <button data-block="```math\n|\n```" title="Math block">Math</button>
  </div>
  <div id="panes">
    <textarea id="editor" spellcheck="false" placeholder="# Start typing markdown here…"></textarea>
    <div id="previewWrap"><div id="doc"></div></div>
  </div>

<script>
const editor = document.getElementById('editor');
const doc = document.getElementById('doc');
const status = document.getElementById('status');
const filenameInput = document.getElementById('filename');
const STORAGE_KEY = 'md-editor-draft';

marked.setOptions({ gfm: true, breaks: false });

// Same GitLab-flavored math handling as md-preview.html:
//  - fenced ```math blocks -> KaTeX display math
//  - inline $`...`$ -> KaTeX inline math
function render(text) {
  const inlineMath = [];
  text = text.replace(/\$`([^`]+?)`\$/g, (_, tex) => {
    inlineMath.push(tex);
    return `@@MATHINLINE${inlineMath.length - 1}@@`;
  });

  let html = marked.parse(text);

  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('code.language-math').forEach(code => {
    const wrap = document.createElement('div');
    try {
      katex.render(code.textContent, wrap, { displayMode: true, throwOnError: false });
    } catch (e) {
      wrap.textContent = code.textContent;
    }
    code.closest('pre').replaceWith(wrap);
  });
  html = tmp.innerHTML;

  html = html.replace(/@@MATHINLINE(\d+)@@/g, (_, i) => {
    try {
      return katex.renderToString(inlineMath[+i], { displayMode: false, throwOnError: false });
    } catch (e) {
      return inlineMath[+i];
    }
  });

  doc.innerHTML = html;
  doc.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
}

let debounceTimer;
function scheduleRender() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    render(editor.value);
    try { localStorage.setItem(STORAGE_KEY, editor.value); } catch (e) {}
  }, 150);
}
editor.addEventListener('input', scheduleRender);

// Load a file into the editor.
function loadFile(file) {
  filenameInput.value = file.name;
  const reader = new FileReader();
  reader.onload = () => {
    editor.value = reader.result;
    render(editor.value);
    status.textContent = `Opened ${file.name}`;
  };
  reader.readAsText(file);
}

document.getElementById('openBtn').addEventListener('click', () => picker.click());
picker.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

// "Save" = trigger a normal browser download of the current text.
// (This page is a local file, not a sandboxed artifact, so downloads work normally;
// point Firefox's save dialog at the same file/folder to overwrite it in place.)
document.getElementById('saveBtn').addEventListener('click', () => {
  const name = filenameInput.value.trim() || 'untitled.md';
  const blob = new Blob([editor.value], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  status.textContent = `Saved ${name}`;
});

document.getElementById('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(editor.value);
    status.textContent = 'Copied to clipboard';
  } catch (e) {
    status.textContent = 'Copy failed — select and copy manually';
  }
});

// Toolbar: wrap selection, prefix each selected line, or insert a block template.
document.getElementById('toolbar').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  editor.focus();
  const start = editor.selectionStart, end = editor.selectionEnd;
  const selected = editor.value.slice(start, end);

  if (btn.dataset.wrap) {
    const [before, after] = btn.dataset.wrap.split('|');
    const text = before + (selected || 'text') + after;
    editor.setRangeText(text, start, end, 'select');
  } else if (btn.dataset.line) {
    const lineStart = editor.value.lastIndexOf('\n', start - 1) + 1;
    editor.setRangeText(btn.dataset.line, lineStart, lineStart, 'end');
  } else if (btn.dataset.block) {
    const [before, after] = btn.dataset.block.split('|');
    const text = before + (selected || '') + after;
    editor.setRangeText(text, start, end, 'select');
  }
  scheduleRender();
});

// Restore the last draft, if any, so a reload doesn't lose work.
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) editor.value = saved;
} catch (e) {}
if (!editor.value) {
  editor.value = '# New Document\n\nStart typing here.\n';
}
render(editor.value);
</script>
</body>
</html>
